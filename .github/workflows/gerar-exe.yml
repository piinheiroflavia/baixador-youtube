name: Gerar programa para Windows

# Roda quando o código muda ou quando alguém clica em "Run workflow"
# (Actions > Gerar programa para Windows > Run workflow). Use o botão se o
# YouTube mudar e o download parar de funcionar: a nova versão já vem com o
# yt-dlp mais recente. Não roda sozinho toda semana para não perder a
# reputação do arquivo no SmartScreen do Windows.
on:
  push:
    branches: [main]
    paths: ["Baixador_YouTube.pyw", "icone.ico", "icone.png", "logo_cliente.png", "logo_cliente_download.png", ".github/workflows/gerar-exe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install --upgrade pyinstaller "yt-dlp[default]" imageio-ffmpeg deno pillow pypac

      - name: Gravar o número da versão
        run: Set-Content -Path versao.txt -Value "${{ github.run_number }}" -Encoding ascii

      - name: Gerar o .exe
        run: |
          $deno = python -c "import deno; print(deno.find_deno_bin())"
          Write-Host "Deno: $deno"
          pyinstaller Baixador_YouTube.pyw `
            --onefile --windowed --noconfirm `
            --name BaixadorYouTube `
            --icon icone.ico `
            --add-data "icone.ico;." `
            --add-data "icone.png;." `
            --add-data "logo_cliente.png;." `
            --add-data "logo_cliente_download.png;." `
            --add-data "versao.txt;." `
            --add-binary "$deno;." `
            --collect-all imageio_ffmpeg `
            --collect-all yt_dlp `
            --collect-all yt_dlp_ejs `
            --collect-all pypac `
            --collect-all dukpy `
            --collect-all publicsuffixlist

      - name: Publicar na página de downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: baixador
          name: Baixador do YouTube (versão ${{ github.run_number }})
          body: |
            Baixe o arquivo **BaixadorYouTube.exe** abaixo e dê dois cliques para abrir.
            Não precisa instalar nada.
          files: dist/BaixadorYouTube.exe
          make_latest: true
